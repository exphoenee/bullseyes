<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bullseye</title>
  <meta name="description" content="Bullseye is a small canvas arcade game: control the bull with your mouse and protect the hatching larvae from the toads." />
  <meta name="author" content="exphoenee" />
  <meta name="keywords" content="bullseye, game, canvas, arcade, javascript, vite, browser game" />
  <meta name="theme-color" content="#000000" />

  <!-- Open Graph (Facebook, Discord, WhatsApp, LinkedIn, ...) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Bullseye" />
  <meta property="og:title" content="Bullseye" />
  <meta property="og:description" content="A small canvas arcade game: control the bull with your mouse and protect the hatching larvae from the toads." />
  <meta property="og:url" content="https://bullseyes.netlify.app/" />
  <meta property="og:image" content="https://bullseyes.netlify.app/og-image.png" />
  <meta property="og:image:width" content="1280" />
  <meta property="og:image:height" content="720" />
  <meta property="og:image:alt" content="Bullseye gameplay field" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Bullseye" />
  <meta name="twitter:description" content="A small canvas arcade game: control the bull with your mouse and protect the hatching larvae from the toads." />
  <meta name="twitter:image" content="https://bullseyes.netlify.app/og-image.png" />
  <meta name="twitter:image:alt" content="Bullseye gameplay field" />

  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <canvas id="canvas1"></canvas>
    <img id="overlay" src="images/overlay.png" alt="overlay" />
  </div>

  <!-- sprite sources, hidden -->
  <div class="assets">
    <img id="obstacles" class="images" src="images/obstacles.png" alt="obstacles" />
    <img id="bull" class="images" src="images/bull.png" alt="player" />
    <img id="egg" class="images" src="images/egg.png" alt="egg" />
    <img id="toad" class="images" src="images/toads.png" alt="enemy" />
    <img id="larva" class="images" src="images/larva.png" alt="larva" />
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
